<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>ASF GROUP — Ekranga qo'shish</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --navy:#012154; --navy2:#16243f; --navy3:#0b3a8c; --red:#e11d2e; --ice:#eef1f7;
  --ink:#0f1522; --muted:#6b7484; --ios:#0a84ff; --g:#1a73e8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--navy)}
body{font-family:Montserrat,"Noto Color Emoji",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 10%,#0a3b8f 0%,#022a6b 38%,#011a45 72%,#010f2b 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
#b1{width:720px;height:720px;left:-260px;top:-160px;background:#1d5fd1}
#b2{width:620px;height:620px;right:-240px;top:900px;background:#e11d2e;opacity:.22}
#b3{width:560px;height:560px;left:220px;top:1500px;background:#2f7cf6;opacity:.35}
.hex{position:absolute;width:900px;height:900px;left:90px;top:520px;opacity:.07}
.grain{position:absolute;inset:0;background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 2px,transparent 2px 4px)}

/* Brend satri */
#brand{position:absolute;left:60px;top:54px;display:flex;align-items:center;gap:22px}
#brandLogoSlot{width:84px;height:84px}
#brandText b{display:block;font-size:34px;font-weight:800;letter-spacing:1px}
#brandText span{display:block;font-size:22px;font-weight:600;color:rgba(255,255,255,.62);letter-spacing:3px;text-transform:uppercase;margin-top:4px}
#platform{position:absolute;right:60px;top:74px;padding:12px 22px;border-radius:40px;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.18);font-size:24px;font-weight:700;letter-spacing:.5px}

#bigLogo{position:absolute;left:0;top:0;width:360px;height:360px;border-radius:84px;overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,.45),0 0 0 2px rgba(255,255,255,.12);transform-origin:0 0}
#bigLogo img{width:100%;height:100%;display:block;transform:scale(1.02)}

.intro{position:absolute;left:0;right:0;text-align:center}
#introTitle{top:1000px;font-size:70px;font-weight:800;line-height:1.12;padding:0 70px}
#introSub{top:1200px;font-size:34px;font-weight:600;color:rgba(255,255,255,.75)}
#introSub i{font-style:normal;display:inline-block;padding:14px 30px;border-radius:50px;background:var(--red);color:#fff;box-shadow:0 12px 40px rgba(225,29,46,.45)}

/* Sarlavhalar */
.cap{position:absolute;left:70px;right:70px;top:196px}
.badge{display:inline-flex;align-items:center;gap:12px;padding:10px 22px 10px 12px;border-radius:40px;background:var(--red);
  font-size:24px;font-weight:800;letter-spacing:2px;box-shadow:0 10px 30px rgba(225,29,46,.4)}
.badge em{font-style:normal;width:36px;height:36px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-size:21px;letter-spacing:0}
.badge.ok{background:#12a150;box-shadow:0 10px 30px rgba(18,161,80,.4)}
.badge.ok em{color:#12a150}
.title{margin-top:24px;font-size:60px;font-weight:800;line-height:1.15}
.title .w{display:inline-block;white-space:pre}
.sub{margin-top:18px;font-size:32px;font-weight:600;color:rgba(255,255,255,.72);line-height:1.3}
.sub.warn{color:#ffb4bb}
.sub.warn b{color:#fff;background:var(--red);padding:2px 12px;border-radius:10px}
.q{color:#9cc3ff}

/* Telefon */
#phoneWrap{position:absolute;left:540px;top:600px;width:0;height:0}
#phoneScale{position:absolute;left:-209px;top:0;transform:scale(1.4);transform-origin:209px 0}
.phone{position:relative;width:418px;height:872px;border-radius:70px;padding:14px;
  background:linear-gradient(145deg,#3a3f4a,#15181f 40%,#2b2f38);
  box-shadow:0 60px 140px rgba(0,0,0,.55),0 0 0 2px #50555f inset,0 0 0 4px #0b0d12}
.phone.sam{border-radius:52px;padding:11px;width:412px;height:866px;background:linear-gradient(145deg,#2c2f36,#0e1014 50%,#23262c)}
.screen{position:relative;width:390px;height:844px;border-radius:56px;overflow:hidden;background:#fff;color:var(--ink);
  font-family:-apple-system,"Liberation Sans",Montserrat,"Noto Color Emoji",sans-serif}
.phone.sam .screen{border-radius:42px;font-family:"Liberation Sans",Montserrat,"Noto Color Emoji",sans-serif}
.island{position:absolute;left:50%;top:11px;width:122px;height:35px;margin-left:-61px;background:#000;border-radius:20px;z-index:50}
.punch{position:absolute;left:50%;top:12px;width:14px;height:14px;margin-left:-7px;background:#000;border-radius:50%;z-index:50;box-shadow:0 0 0 2px #111}
.layer{position:absolute;left:0;top:0;width:390px;height:844px}

/* Holat satri */
.sb{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;font-weight:700;font-size:16px;z-index:5}
.sb.sam{height:34px;padding:2px 18px 0 22px;font-size:13px;font-weight:600}
.sb .ic{display:flex;gap:6px;align-items:center}
.sb.light{color:#fff}

/* Mini App nusxasi */
.app{position:absolute;left:0;right:0;bottom:0;background:#fff;overflow:hidden}
.a-head{display:flex;align-items:center;gap:10px;padding:10px 16px}
.a-logo{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0}
.a-logo img{width:100%;height:100%}
.a-hi{font-size:10px;letter-spacing:1.2px;color:var(--muted);font-weight:600}
.a-name{font-size:19px;font-weight:800}
.a-lang{margin-left:auto;border:1.5px solid #e3e6ee;border-radius:20px;padding:5px 11px;font-weight:800;font-size:12px}
.a-wrap{padding:4px 16px}
.a-hint{position:relative;background:var(--ice);border-radius:16px;padding:10px 12px;font-size:10.5px;line-height:1.35;margin-bottom:10px}
.a-hint .h{display:flex;gap:8px;align-items:center;font-weight:800;font-size:11.5px}
.a-hint .h img{width:28px;height:28px;border-radius:7px}
.a-hint ol{padding-left:16px;margin-top:5px}
.a-hint .x{position:absolute;right:10px;top:6px;color:#9aa1ad;font-size:16px}
.a-hint .btn{display:inline-block;margin-top:7px;background:var(--navy2);color:#fff;padding:7px 14px;border-radius:12px;font-weight:700}
.a-hero{position:relative;background:var(--navy2);color:#fff;border-radius:20px;padding:16px;overflow:hidden}
.a-hero:after{content:"";position:absolute;right:-50px;top:-30px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.06)}
.a-hero b{font-size:18px;font-weight:800}
.a-hero p{font-size:11.5px;opacity:.75;margin:6px 0 12px}
.a-hero span{display:inline-block;background:#fff;color:var(--navy2);font-weight:800;font-size:12px;padding:9px 16px;border-radius:20px}
.a-cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.a-cat{border:1.5px solid #e8eaf0;border-radius:16px;padding:10px 12px;font-size:13px}
.a-cat small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.a-sec{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px;font-weight:800;font-size:15px}
.a-sec small{color:var(--muted);font-size:11px;font-weight:600}
.a-prods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.a-prod{border-radius:16px;background:linear-gradient(160deg,#f3f4f7,#e6e8ee);height:150px;display:grid;place-items:center;font-size:62px;position:relative}
.a-prod i{position:absolute;left:10px;bottom:8px;font-style:normal;font-size:11px;font-weight:800;background:#fff;border-radius:10px;padding:4px 8px}
.a-nav{position:absolute;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #eef0f4;padding:7px 0 6px;font-size:9.5px;font-weight:700;text-align:center;color:#8a93a3}
.a-nav div:first-child{color:var(--navy2)}
.a-nav span{display:block;font-size:19px;margin-bottom:2px}

/* Safari */
.saf{position:absolute;left:12px;right:12px;bottom:26px;height:54px;display:flex;gap:8px;align-items:center;z-index:6}
.saf .r{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 6px 24px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.08);display:grid;place-items:center;font-size:20px;font-weight:800;color:#222}
.saf .u{flex:1;height:52px;border-radius:26px;background:rgba(255,255,255,.9);box-shadow:0 6px 24px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14.5px;font-weight:600;color:#222;position:relative}
.saf .u .ring{position:absolute;inset:-5px;border-radius:30px;border:3px solid var(--red)}
.homebar{position:absolute;left:50%;bottom:8px;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#111;z-index:9}
.homebar.l{background:#fff}

/* iOS menyu */
.imenu{position:absolute;right:10px;bottom:88px;width:300px;border-radius:26px;background:rgba(248,248,250,.93);
  box-shadow:0 20px 60px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.1);padding:8px 0;transform-origin:92% 100%;backdrop-filter:blur(20px);z-index:7}
.it{position:relative;display:flex;align-items:center;gap:14px;padding:0 18px;height:46px;font-size:15.5px;color:#111}
.it .ico{width:22px;text-align:center;font-size:17px;color:#333}
.it .hl{position:absolute;inset:2px 8px;border-radius:14px;background:rgba(10,132,255,.18)}
.it .hl.red{background:rgba(225,29,46,.14)}
.it>*:not(.hl){position:relative}
.it.sep{border-top:.5px solid rgba(0,0,0,.12)}
.cross{position:absolute;left:10px;right:10px;top:50%;height:3px;background:var(--red);border-radius:2px;transform-origin:0 50%}
.nob{position:absolute;right:14px;top:50%;margin-top:-13px;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px}

/* Ulashish oynasi */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:7}
.sheet{position:absolute;left:0;right:0;bottom:0;height:660px;background:#f2f2f7;border-radius:34px 34px 0 0;z-index:8;overflow:hidden}
.sh-head{display:flex;align-items:center;gap:12px;padding:20px 20px 14px}
.sh-head img{width:48px;height:48px;border-radius:12px}
.sh-head b{display:block;font-size:16px}
.sh-head small{color:#8a8a8e;font-size:13px}
.sh-head .cl{margin-left:auto;width:30px;height:30px;border-radius:50%;background:#e3e3e8;display:grid;place-items:center;color:#8a8a8e;font-weight:800}
.sh-apps{display:flex;gap:16px;padding:8px 20px 16px;border-bottom:.5px solid #d6d6db}
.sh-app{width:62px;text-align:center;font-size:11px;color:#333}
.sh-app div{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:28px;margin-bottom:6px;color:#fff}
.sh-list{position:absolute;left:16px;right:16px;top:206px}
.grp{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:14px}
.grp .it{height:50px;justify-content:space-between;border-bottom:.5px solid #e4e4e9;font-size:16px}
.grp .it:last-child{border-bottom:0}
.grp .it .ico{order:2}

/* Ekranga qo'shish oynasi (iOS) */
.addv{position:absolute;left:0;right:0;top:48px;bottom:0;background:#f2f2f7;border-radius:14px 14px 0 0;z-index:9;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.addnav{display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 18px;font-size:16.5px}
.addnav .c{color:var(--ios)}
.addnav b{font-size:16.5px}
.addnav .a{color:var(--ios);font-weight:700;position:relative;padding:6px 10px;margin-right:-10px;border-radius:12px}
.addnav .a .hl{position:absolute;inset:0;border-radius:12px;background:rgba(10,132,255,.18)}
.addcard{margin:18px 16px 8px;background:#fff;border-radius:14px;display:flex;gap:14px;padding:14px}
.addcard img{width:64px;height:64px;border-radius:15px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.addcard .f{flex:1}
.addcard .f div{padding:8px 0;font-size:16.5px;border-bottom:.5px solid #e4e4e9}
.addcard .f div+div{border:0;color:#8a8a8e;font-size:14px}
.caret{display:inline-block;width:2px;height:19px;background:var(--ios);vertical-align:-3px;margin-left:1px}
.addnote{padding:4px 30px 18px;color:#8a8a8e;font-size:13px;line-height:1.35}
.addrow{margin:0 16px;background:#fff;border-radius:14px;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:16px}
.sw{width:51px;height:31px;border-radius:16px;background:#34c759;position:relative}
.sw:after{content:"";position:absolute;right:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}

/* Bosh ekran */
.home{overflow:hidden}
.wall{position:absolute;inset:0}
.wall.ios{background:radial-gradient(90% 55% at 20% 15%,#5b7cff 0%,transparent 60%),radial-gradient(80% 50% at 85% 70%,#e0457b 0%,transparent 60%),linear-gradient(170deg,#1b2a6b,#3a1f6b 55%,#10183f)}
.wall.sam{background:radial-gradient(90% 60% at 80% 20%,#27c3c7 0%,transparent 60%),radial-gradient(90% 60% at 10% 80%,#4a3cd6 0%,transparent 60%),linear-gradient(165deg,#0d2b5a,#1a1650 60%,#0a0f2e)}
.grid{position:absolute;left:0;right:0;top:78px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:26px;padding:0 14px}
.grid.sam{top:292px;row-gap:22px;padding:0 18px}
.ap{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);position:relative}
.ap .i{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;font-size:31px;box-shadow:0 4px 12px rgba(0,0,0,.25);overflow:hidden}
.grid.sam .ap .i{width:58px;height:58px;border-radius:20px;font-size:28px}
.ap .i img{width:100%;height:100%}
.glow{position:absolute;left:50%;top:31px;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:18px;border:3px solid #fff;box-shadow:0 0 30px 6px rgba(255,255,255,.55)}
.grid.sam .glow{top:29px;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:21px}
.spark{position:absolute;left:50%;top:31px;width:8px;height:8px;margin:-4px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}
.dock{position:absolute;left:12px;right:12px;bottom:22px;height:92px;border-radius:34px;background:rgba(255,255,255,.22);backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;justify-items:center}
.dock.sam{background:transparent;bottom:40px}
.dock .i{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;font-size:31px}
.dock.sam .i{width:58px;height:58px;border-radius:20px}
.search{position:absolute;left:50%;bottom:130px;width:92px;margin-left:-46px;height:30px;border-radius:15px;background:rgba(255,255,255,.25);font-size:12.5px;color:#fff;display:grid;place-items:center}
.clock{position:absolute;left:28px;top:84px;color:#fff}
.clock b{display:block;font-size:76px;font-weight:300;letter-spacing:-2px;font-family:"Liberation Sans",sans-serif}
.clock span{font-size:16px;opacity:.9}

.splash{position:absolute;background:var(--navy);display:grid;place-items:center;overflow:hidden;z-index:20}
.splash img{width:62%;max-width:240px}

/* Chrome (Samsung) */
.ch-bar{position:absolute;left:0;right:0;top:34px;height:58px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;background:#fff;z-index:6;border-bottom:1px solid #eceef1}
.ch-bar .home-i{font-size:20px;color:#444}
.ch-url{flex:1;height:40px;border-radius:22px;background:#f1f3f4;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14.5px;color:#202124;position:relative}
.ch-url .ring{position:absolute;inset:-5px;border-radius:26px;border:3px solid var(--red)}
.ch-tabs{width:22px;height:22px;border:2.2px solid #444;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#444}
.ch-dots{width:34px;height:40px;display:grid;place-items:center;position:relative}
.ch-dots i{display:block;width:4.5px;height:4.5px;border-radius:50%;background:#444;box-shadow:0 -7px 0 #444,0 7px 0 #444}
.ch-dots .hl{position:absolute;inset:0;border-radius:50%;background:rgba(26,115,232,.18)}
.cmenu{position:absolute;right:6px;top:38px;width:282px;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.28);padding:4px 0 8px;transform-origin:95% 0;z-index:8}
.cm-top{display:flex;justify-content:space-around;height:50px;align-items:center;font-size:19px;color:#444;border-bottom:1px solid #eceef1;margin-bottom:4px}
.cmenu .it{height:43px;font-size:15px;color:#202124;gap:16px}
.cmenu .it .ico{color:#5f6368;font-size:16px}
.cmenu .it .hl{inset:0;border-radius:0;background:rgba(26,115,232,.16)}
.cdlg{position:absolute;left:30px;right:30px;top:300px;background:#fff;border-radius:28px;padding:24px 24px 14px;z-index:9;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.cdlg h3{font-size:22px;font-weight:500;color:#202124;margin-bottom:18px}
.cdlg .row{display:flex;gap:14px;align-items:center}
.cdlg .row img{width:52px;height:52px;border-radius:14px}
.cdlg .row b{display:block;font-size:17px;font-weight:600;color:#202124}
.cdlg .row small{color:#5f6368;font-size:13.5px}
.cdlg .btns{display:flex;justify-content:flex-end;gap:6px;margin-top:22px}
.cdlg .btns div{position:relative;padding:11px 16px;border-radius:22px;color:var(--g);font-weight:700;font-size:15px}
.cdlg .btns div.p{background:var(--g);color:#fff}
.cdlg .btns .hl{position:absolute;inset:0;border-radius:22px;background:rgba(255,255,255,.35)}
.snack{position:absolute;left:14px;right:14px;bottom:70px;background:#303134;color:#fff;border-radius:10px;padding:14px 16px;font-size:14px;display:flex;gap:10px;align-items:center;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.snack img{width:24px;height:24px;border-radius:6px}
.gest{position:absolute;left:50%;bottom:9px;width:120px;height:4px;margin-left:-60px;border-radius:3px;background:#222;z-index:9}
.gest.l{background:#fff}

/* Barmoq */
#touch{position:absolute;left:0;top:0;width:0;height:0;z-index:40}
#dot{position:absolute;left:-24px;top:-24px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 6px rgba(225,29,46,.35)}
#rip{position:absolute;left:-24px;top:-24px;width:48px;height:48px;border-radius:50%;border:3px solid #fff}

/* Yakun */
#outroTitle{top:1010px;font-size:64px;font-weight:800}
#outroSub{top:1110px;font-size:30px;font-weight:600;color:rgba(255,255,255,.72);letter-spacing:6px;text-transform:uppercase}
#outroTip{top:1250px;padding:0 90px;font-size:32px;font-weight:600;line-height:1.35;color:#fff}
#outroTip span{display:inline-block;padding:22px 34px;border-radius:30px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2)}
#outroBot{top:1480px;font-size:34px;font-weight:700}
#outroBot i{font-style:normal;display:inline-block;padding:16px 34px;border-radius:50px;background:#fff;color:var(--navy)}
#bar{position:absolute;left:0;bottom:0;height:10px;width:0;background:linear-gradient(90deg,var(--red),#ff5a67)}
#fade{position:absolute;inset:0;background:#010f2b;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div>
  <svg class="hex" id="hex" viewBox="0 0 100 100"><polygon points="50,3 91,26.5 91,73.5 50,97 9,73.5 9,26.5" fill="none" stroke="#fff" stroke-width="1.2"/><polygon points="50,15 80.5,32.5 80.5,67.5 50,85 19.5,67.5 19.5,32.5" fill="none" stroke="#fff" stroke-width=".6"/></svg>
  <div class="grain"></div>

  <div id="brand"><div id="brandLogoSlot"></div><div id="brandText"><b>ASF GROUP</b><span>Qo'llanma</span></div></div>
  <div id="platform"></div>

  <div class="intro" id="introTitle">Ilovani telefon ekraniga qo'shish</div>
  <div class="intro" id="introSub"><i></i></div>

  <div id="caps"></div>

<script>
const V = new URLSearchParams(location.search).get('v') || 'iphone';
const IOS = V === 'iphone';
const $ = (s, r = document) => r.querySelector(s);
const scr = $('#scr');

/* ================= Animatsiya dvigateli ================= */
const E = {
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  out5: t => 1 - Math.pow(1 - t, 5),
  in: t => t * t * t,
  lin: t => t,
  back: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  step: t => t < 1 ? 0 : 1,
};
const tracks = new Map();
const hooks = [];
function k(el, prop, keys) {
  if (typeof el === 'string') el = $(el);
  if (!el) throw new Error('no el for ' + prop);
  if (!tracks.has(el)) tracks.set(el, {});
  const cur = tracks.get(el);
  cur[prop] = (cur[prop] || []).concat(keys).sort((a, b) => a[0] - b[0]);
}
function at(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const b = keys[i];
    if (t < b[0]) {
      const a = keys[i - 1];
      const p = (t - a[0]) / (b[0] - a[0] || 1);
      return a[1] + (b[1] - a[1]) * E[b[2] || 'io'](p);
    }
  }
  return keys[keys.length - 1][1];
}
const TF = ['x', 'y', 's', 'r', 'sx', 'sy'];
function render(t) {
  for (const [el, props] of tracks) {
    const v = { x: 0, y: 0, s: 1, r: 0, sx: 1, sy: 1 };
    let tf = false;
    for (const p in props) { v[p] = at(props[p], t); if (TF.includes(p)) tf = true; }
    if (tf) el.style.transform = `translate(${v.x}px,${v.y}px) scale(${v.s * v.sx},${v.s * v.sy}) rotate(${v.r}deg)`;
    if ('o' in props) { el.style.opacity = v.o; el.style.visibility = v.o <= 0.001 ? 'hidden' : 'visible'; }
    if ('blur' in props) el.style.filter = v.blur > .05 ? `blur(${v.blur}px)` : 'none';
    if ('w' in props) el.style.width = v.w + 'px';
  }
  hooks.forEach(h => h(t));
}
/** Paydo bo'lish / yo'qolish */
function show(el, tin, tout, o = {}) {
  const { d = .5, dy = 0, dx = 0, s0 = 1, blur = 0, dOut = .4, dyOut = 0, sOut = 1, ease = 'out5' } = o;
  const O = [[tin, 0], [tin + d, 1, ease]];
  if (tout != null) O.push([tout, 1], [tout + dOut, 0, 'io']);
  k(el, 'o', O);
  if (dy || dyOut) { const Y = [[tin, dy], [tin + d, 0, ease]]; if (tout != null) Y.push([tout, 0], [tout + dOut, dyOut, 'in']); k(el, 'y', Y); }
  if (dx) k(el, 'x', [[tin, dx], [tin + d, 0, ease]]);
  if (s0 !== 1 || sOut !== 1) { const S = [[tin, s0], [tin + d, 1, ease]]; if (tout != null) S.push([tout, 1], [tout + dOut, sOut, 'in']); k(el, 's', S); }
  if (blur) { const B = [[tin, blur], [tin + d, 0, ease]]; if (tout != null) B.push([tout, 0], [tout + dOut, blur, 'in']); k(el, 'blur', B); }
}
const hide = (el, t) => k(el, 'o', [[0, 0], [t, 0]]);

/* ================= Umumiy qismlar ================= */

      ${sam ? '<b style="font-size:11px">LTE</b>' : '<svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.3-2.6a3.2 3.2 0 00-4.6 0zM4.1 7.2a5.6 5.6 0 017.8 0l1.6-1.8a8 8 0 00-11 0zM.8 3.6a10.3 10.3 0 0114.4 0L16.8 1.8a12.7 12.7 0 00-17.6 0z" fill="currentColor"/></svg>'}
      <svg width="${sam ? 22 : 27}" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2.5" y="2.5" width="17" height="8" rx="2" fill="currentColor"/><rect x="25" y="4.5" width="2" height="4" rx="1" fill="currentColor" opacity=".45"/></svg>

const asfIcon = `<div class="ap" id="asfApp"><div class="glow" id="glow"></div>${Array.from({ length: 8 }, (_, i) => `<div class="spark" id="sp${i}"></div>`).join('')}<div class="i" id="asfI"><img src="apple-touch-icon.png"></div><span>ASF GROUP</span></div>`;

/* ================= Sarlavhalar ================= */
function caption(t0, t1, badge, title, sub, cls = '') {
  const el = document.createElement('div');
  el.className = 'cap';
  // So'zlarga bo'lamiz, «...» bo'laklar butunligicha qoladi
  const tmp = document.createElement('div');
  tmp.innerHTML = title;
  const words = [...tmp.childNodes].flatMap(n => n.nodeType === 3
    ? n.textContent.split(/\s+/).filter(Boolean).map(w => `<span class="w">${w} </span>`)
    : [`<span class="w">${n.outerHTML} </span>`]).join('');
  el.innerHTML = `<div class="badge ${cls}"><em>${cls === 'ok' ? '✓' : badge}</em>${cls === 'ok' ? 'TAYYOR' : badge + '-QADAM'}</div>
    <div class="title">${words}</div>${sub ? `<div class="sub ${sub.startsWith('!') ? 'warn' : ''}">${sub.replace(/^!/, '')}</div>` : ''}`;
  $('#caps').appendChild(el);
  const b = $('.badge', el);
  show(b, t0, t1, { d: .55, dy: 26, s0: .7, blur: 6, dyOut: -20 });
  el.querySelectorAll('.w').forEach((w, i) => show(w, t0 + .12 + i * .06, t1, { d: .6, dy: 40, blur: 10, dyOut: -24, dOut: .35 }));
  const s = $('.sub', el);
  if (s) show(s, t0 + .45, t1, { d: .6, dy: 24, blur: 6, dyOut: -16 });
  return el;
}
const q = (s) => `<span class="q">«${s}»</span>`;

/* ================= Barmoq ================= */
const touch = document.createElement('div');
touch.id = 'touch';
touch.innerHTML = '<div id="rip"></div><div id="dot"></div>';
const taps = [];
function finger(path) {
  // path: [t, x, y, tap?]
  k(touch, 'x', path.map(p => [p[0], p[1], 'io']));
  k(touch, 'y', path.map(p => [p[0], p[2], 'io']));
  path.filter(p => p[3]).forEach(p => taps.push(p[0]));
}
hooks.push((t) => {
  const dot = $('#dot'), rip = $('#rip');
  let ds = 1, rs = 1, ro = 0;
  for (const tt of taps) {
    const d = t - tt;
    if (d > -0.15 && d < 0.2) ds = Math.min(ds, d < 0 ? 1 - .25 * E.out((d + .15) / .15) : .75 + .25 * E.out(d / .2));
    if (d >= 0 && d < .65) { rs = 1 + 1.8 * E.out(d / .65); ro = .9 * (1 - d / .65); }
  }
  dot.style.transform = `scale(${ds})`;
  rip.style.transform = `scale(${rs})`;
  rip.style.opacity = ro;
});
const hl = (el, t, hold = .5) => k($('.hl', el) || el, 'o', [[0, 0], [t - .06, 0], [t + .06, 1, 'out'], [t + hold, 1], [t + hold + .35, 0]]);

/* ================= Joy (koordinata) ================= */
function pos(el) {
  const r = el.getBoundingClientRect(), s = scr.getBoundingClientRect(), f = s.width / 390;
  return [(r.left - s.left + r.width / 2) / f, (r.top - s.top + r.height / 2) / f];
}

/* ================= Fon harakati ================= */
hooks.push((t) => {
  $('#b1').style.transform = `translate(${Math.sin(t * .35) * 80}px,${Math.cos(t * .28) * 60}px)`;
  $('#b2').style.transform = `translate(${Math.cos(t * .3) * 90}px,${Math.sin(t * .25) * 80}px)`;
  $('#b3').style.transform = `translate(${Math.sin(t * .22 + 1) * 110}px,${Math.cos(t * .31) * 50}px)`;
  $('#hex').style.transform = `rotate(${t * 3}deg) scale(${1 + Math.sin(t * .4) * .03})`;
});

  k(L, 'r', [[0, -8], [1.1, 0, 'back']]);
  show('#introTitle', .5, phoneIn - .7, { d: .8, dy: 50, blur: 12, dyOut: -30 });
  show('#introSub', 1.0, phoneIn - .7, { d: .7, dy: 40, s0: .8, dyOut: -30 });

  // Telefon

  k('#phoneWrap', 'r', [[phoneIn - .2, 8], [phoneIn + 1.1, 0, 'out5'], [outro - .2, 0], [outro + .7, -6, 'in']]);

  hooks.push(t => { $('#bar').style.width = (1080 * Math.min(1, t / T)) + 'px'; });

  k(g, 's', [[t0 + .4, .9], [t0 + .9, 1.18, 'out'], [t0 + 1.4, 1.05], [t0 + 1.9, 1.18], [t0 + 2.6, 1.05], [t0 + 3.1, 1.18], [t0 + 3.8, 1.3]]);
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2 + .3, d = 58 + (i % 2) * 18;
    const sp = $('#sp' + i);
    k(sp, 'x', [[t0 + .35, 0], [t0 + 1.2, Math.cos(a) * d, 'out']]);

    k(sp, 'o', [[0, 0], [t0 + .35, 0], [t0 + .45, 1], [t0 + 1.25, 0]]);
    k(sp, 's', [[t0 + .35, 1.4], [t0 + 1.2, .3]]);
  }
}

  hooks.push(t => {
    const p = E.io(Math.max(0, Math.min(1, (t - t0) / .6)));
    sp.style.visibility = t < t0 ? 'hidden' : 'visible';
    sp.style.left = a.x * (1 - p) + 'px';

    sp.style.opacity = t < t0 + 1.4 ? 1 : Math.max(0, 1 - (t - t0 - 1.4) / .45);
    $('img', sp).style.transform = `scale(${.25 + .75 * p})`;
