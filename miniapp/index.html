<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- Telefon ekraniga qo'shilganda ("Добавить на экран «Домой»") ASF logosi chiqadi -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="ASF GROUP" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B2257" />
    <title>ASF GROUP</title>
    <link rel="preconnect" href="https://asfgroup.onrender.com" crossorigin />
    <link rel="preconnect" href="https://telegram.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Shrift sahifa chizilishini to'xtatib turmaydi: kelguncha tizim shrifti ishlatiladi -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link rel="preload" as="image" href="/logo.png" />
    <style>
      /* Ilova kodi yuklanguncha oq ekran o'rniga darhol logo ko'rinadi */
      html, body { margin: 0; background: #F3F6FC; }
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      .boot img { width: 96px; height: 96px; object-fit: contain; }
      .boot i { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #d6deef; border-top-color: #0B2257; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // Render'dagi server uxlab qolgan bo'lsa, uni ilova kodi yuklanguncha
      // uyg'ota boshlaymiz — shu bilan bir necha soniya yutiladi
      try { fetch('https://asfgroup.onrender.com/api/health', { mode: 'no-cors' }).catch(function () {}); } catch (_) {}

      // Zaxira: ilova kodi umuman yuklanmasa (eski versiya keshda qolgan bo'lsa)
      // logo ekranida qotib qolmay, sahifa bir marta o'zi yangilanadi
      setTimeout(function () {
        if (!document.querySelector('#root > .boot')) return;
        try {
          var last = +sessionStorage.getItem('asf_recover_at') || 0;
          if (Date.now() - last < 20000) return;
          sessionStorage.setItem('asf_recover_at', String(Date.now()));
        } catch (_) {}
        location.reload();
      }, 25000);
    </script>
    <!-- defer: HTML chizilishini to'xtatmaydi, lekin ilova kodidan oldin bajariladi -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="/logo.png" alt="ASF GROUP" /><i></i></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
